apiVersion: apps/v1
kind: Deployment
metadata:
  name: raft-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: raft-a
  template:
    metadata:
      labels:
        app: raft-a
    spec:
      containers:
        - name: raft-a
          image: automated-bugs-triage:latest
          imagePullPolicy: Never
          command: ["python", "raft_node.py", "A"]
          env:
            - name: RUN_ENV
              value: kubernetes
            - name: GRPC_DNS_RESOLVER
              value: native
          ports:
            - containerPort: 60401
          readinessProbe:
            tcpSocket:
              port: 60401
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            tcpSocket:
              port: 60401
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: raft-a
spec:
  selector:
    app: raft-a
  ports:
    - port: 60401
      targetPort: 60401
---
