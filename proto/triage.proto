syntax = "proto3";

package triage;

// The Triage Service definition
service BugTriage {
  // Sends a bug report and returns the triage prediction
  rpc AnalyzeBug (BugRequest) returns (TriageResponse) {}
}

// The request message containing the bug details
message BugRequest {
  string bug_title = 1;
  string bug_description = 2;
  int32 lamport_time = 3;
}

// The response message containing ML predictions
message TriageResponse {
  string predicted_priority = 1;
  string predicted_severity = 2;
  string suggested_assignee = 3;
  int32 lamport_time = 4;
}

// Peer-to-peer mutual exclusion service for Ricart-Agrawala.
service MutexService {
  rpc RequestAccess (AccessRequest) returns (AccessReply) {}
}

message AccessRequest {
  int32 node_id = 1;
  int32 timestamp = 2;
}

message AccessReply {
  int32 node_id = 1;
  int32 timestamp = 2;
}


// Deadlock simulation and resolution
service LockService {
  rpc AcquireLock (LockRequest) returns (LockReply) {}
  rpc ReleaseLock (LockRequest) returns (LockReply) {}
}

message LockRequest {
  string resource_id = 1;
  int32 holder_id = 2;
  int32 timestamp = 3;
}

message LockReply {
  bool granted = 1;
  string message = 2;
}

// Least Connections load balancing
service WorkerService {
  rpc HandleRequest (WorkRequest) returns (WorkReply) {}
}

message WorkRequest {
  int32 request_id = 1;
}

message WorkReply {
  int32 request_id = 1;
  string handled_by = 2;
  string status = 3;
}

syntax = "proto3";

package eventual_demo;

// Eventual consistency with gossip replication
service ReplicaService {
  rpc SaveValue (ValueUpdate) returns (SaveAck) {}
  rpc SyncUpdate (ValueUpdate) returns (SaveAck) {}
  rpc GetValue (ValueQuery) returns (ValueState) {}
}

message ValueUpdate {
  string key = 1;
  string content = 2;
  int32 lamport_timestamp = 3;
  string origin_replica = 4;
}

message SaveAck {
  bool accepted = 1;
  string replica = 2;
  int32 lamport_timestamp = 3;
}

message ValueQuery {
  string key = 1;
}

message ValueState {
  string key = 1;
  string content = 2;
  int32 lamport_timestamp = 3;
  string origin_replica = 4;
}